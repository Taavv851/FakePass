name: Build FakePass9 DEB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and Build DEB
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          export THEOS=$HOME/theos
          chmod +x build_fakepass9.sh
          ./build_fakepass9.sh
      - name: Upload DEB Package
        uses: actions/upload-artifact@v4
        with:
          name: FakePass9-iOS9-DEB
          path: FakePass9/packages/*.deb